# Copyright 2026 Query Farm LLC - https://query.farm
#
# Unit tests and a javadoc build for the SDK itself. The Integration suite
# workflow covers the protocol end-to-end against a real DuckDB, but it only
# ever compiles the example worker -- vgi/src/test carried 278 JUnit tests that
# nothing in CI ran. This workflow is that gate.
#
# The RPC framework resolves from Maven Central (VGI_RPC_JAVA_DIR points at
# nothing, so the composite build stays off).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Resolve vgi-rpc-java (farm.query:vgirpc 0.34.0) from Maven Central, not a
  # sibling checkout: a directory that does not exist turns the composite build off.
  VGI_RPC_JAVA_DIR: /nonexistent

jobs:
  test:
    name: Unit tests (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vgi-java
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew --no-daemon :vgi:test

      # The externalizing storage against vgi-rpc-python's fake blob vendor:
      # threshold boundary, corrupt/missing faults, clean-up, and the storage
      # conformance suite with every value in the vendor. Those tests skip
      # without VGI_BLOB_VENDOR_URL, so this step sets it and then requires them
      # to have run.
      # No uv cache: its post-job prune would wait on the vendor's cache lock.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Externalizing storage against the fake blob vendor
        env:
          VGI_RPC_FAKE_VENDOR_VERSION: 0.57.0
        run: |
          log="$RUNNER_TEMP/fake-vendor.log"
          nohup uvx --from "vgi-rpc==${VGI_RPC_FAKE_VENDOR_VERSION}" \
            vgi-rpc-fake-vendor --test-routes --token "test-token=tenant-a" > "$log" 2>&1 &
          vendor_pid=$!
          trap 'kill "$vendor_pid" 2>/dev/null || true' EXIT
          url=""
          for _ in $(seq 1 360); do
            url="$(sed -n 's/^URL://p' "$log" | head -1)"
            [ -n "$url" ] && break
            sleep 0.5
          done
          [ -n "$url" ] || { echo "::error::fake vendor did not start"; cat "$log"; exit 1; }
          VGI_BLOB_VENDOR_URL="$url" VGI_BLOB_VENDOR_TOKEN=test-token ./gradlew --no-daemon :vgi:test \
            --tests 'farm.query.vgi.storage.Externalizing*' --tests 'farm.query.vgi.storage.StorageEnvelope*'
          for t in ExternalizingStorageTest ExternalizingVendorConformanceTest; do
            xml="vgi/build/test-results/test/TEST-farm.query.vgi.storage.$t.xml"
            grep -q 'skipped="0"' "$xml" || { echo "::error::$t was skipped"; exit 1; }
          done

      # Orchard hosted mode end to end: the example worker as a real process with
      # VGI_ORCHARD_HOSTED=1 against a local JWKS (docs/orchard-hosted-mode.md).
      # The SDK-neutral harness runs in the hosted-conformance job below.
      - name: Orchard hosted mode
        run: ./gradlew --no-daemon :vgi-example-worker:test --tests 'farm.query.vgi.example.OrchardHostedProcessTest'

      # Orchard hosted mode with the blob vendor (OrchardHostedVendorTest): grants bound to the
      # Pass principal, results externalized, the 32 MiB hosted request cap. It skips without the
      # fake vendor, so give it one and require that it ran.
      - name: Orchard hosted mode against the fake blob vendor
        env:
          VGI_RPC_FAKE_VENDOR_VERSION: 0.57.0
        run: |
          uv venv -q "$RUNNER_TEMP/fake-vendor"
          uv pip install -q -p "$RUNNER_TEMP/fake-vendor" \
            "vgi-rpc[http,external]==${VGI_RPC_FAKE_VENDOR_VERSION}"
          VGI_RPC_FAKE_VENDOR_BIN="$RUNNER_TEMP/fake-vendor/bin/vgi-rpc-fake-vendor" \
            ./gradlew --no-daemon :vgi-example-worker:test --tests 'farm.query.vgi.example.OrchardHostedVendorTest'
          xml=vgi-example-worker/build/test-results/test/TEST-farm.query.vgi.example.OrchardHostedVendorTest.xml
          grep -q 'skipped="0"' "$xml" || { echo "::error::OrchardHostedVendorTest was skipped"; exit 1; }

      # The published artifact carries javadoc, so a doc comment that does not
      # build is a broken release, not a warning.
      - name: Javadoc
        run: ./gradlew --no-daemon :vgi:javadoc

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: vgi/build/reports/tests/test

  # The SDK-neutral Orchard hosted-mode conformance harness (vgi repo,
  # test/hosted/run_hosted_conformance.py): a fake Orchard issuer, every startup
  # refusal, Pass verification, JWKS caching, CORS, body-before-auth and log-leak
  # rules, and the claims pass_claims sees. The worker runs at debug level so
  # the leak checks read real output. Each non-HTTP transport is a --refuse-cmd.
  hosted-conformance:
    name: Orchard hosted-mode conformance
    runs-on: ubuntu-latest
    env:
      VGI_HOSTED_HARNESS_REF: fce57984a7e8ea35f9dcd4a034b5ed37c85ca5c5
    steps:
      - name: Checkout vgi-java
        uses: actions/checkout@v4

      - name: Checkout the vgi hosted-mode harness
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_HOSTED_HARNESS_REF }}
          # Not "vgi": that is the SDK module directory in this checkout.
          path: vgi-hosted-harness
          sparse-checkout: test/hosted

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Build example worker
        run: ./gradlew --no-daemon :vgi-example-worker:installDist

      - name: Run the hosted-mode harness
        env:
          JAVA_OPTS: -Dorg.slf4j.simpleLogger.defaultLogLevel=debug
        run: ci/run-hosted-conformance.sh vgi-hosted-harness/test/hosted/run_hosted_conformance.py

  # vgi-rpc's hosted-protocols group against the example worker on stdio, unix
  # and HTTP: conformance.Secondary.v1 hosted beside vgi.v3 through
  # Worker.hostedProtocols, the error model, the traceback policy, and over HTTP
  # the vgi_rpc.Identity.v2 conformance policy (--identity).
  #
  # The reference is cloned from main, deliberately unpinned -- the same pattern
  # vgi-rpc-java's conformance lanes use: it is the yardstick, and a pinned
  # yardstick lets a lane stay green against a stale contract.
  hosted-protocols:
    name: Hosted protocols (stdio, unix, http)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vgi-java
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Clone vgi-rpc-python reference (main, deliberately unpinned)
        run: git clone --depth 1 https://github.com/Query-farm/vgi-rpc-python.git "$RUNNER_TEMP/vgi-rpc-python"

      - name: Install the reference's conformance runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$RUNNER_TEMP/vgi-rpc-python[http,conformance]" pytest pytest-timeout

      - name: Build example worker
        run: ./gradlew --no-daemon :vgi-example-worker:installDist

      - name: Run hosted-protocols group
        run: ci/run-hosted-protocols.sh
        env:
          VGI_WORKER_BIN: ${{ github.workspace }}/vgi-example-worker/build/install/vgi-example-worker/bin/vgi-example-worker
