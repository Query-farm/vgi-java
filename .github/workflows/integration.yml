# Copyright 2026 Query Farm LLC - https://query.farm
#
# Run the canonical VGI suite against the Java worker using a native runner
# built from the same pinned VGI revision. Local standalone-runner checks still
# support the signed community extension through ci/run-integration.sh.
name: Integration suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the test suite to the native runner built from this exact revision.
  # TODO(release-wave): back to a v2.0 revision. Protocol 3.4 (upload-URL v2)
  # lives on vgi's protocol-3.4 branch until the release wave; its suite adds
  # external_storage/upload_integrity.test, and 653b879 has external_storage/
  # assert the fake vendor's client-upload counters (puts_upload, client_uploads).
  # It contains 91f8d63 (scan_planning_predicates*.test, data.planned_events).
  VGI_REF: 653b879c1131a18594918874e8f670d274a37ccb
  VGI_NATIVE_RUNNER_BRANCH: protocol-3.4
  # The fake vendor whose sized PUTs verify like R2, that counts client-upload
  # grants by their origin marker and aims the purpose=upload fault at them
  # (vgi-rpc-python protocol-3.4 f0fb675; vgi 653b879 pins the same).
  VGI_RPC_FAKE_VENDOR_REF: f0fb6754ae5b70900ba21629a1e2d48eb2182774
  # TODO(release-wave): switch to the released vgi-rpc-java (farm.query:vgirpc)
  # that carries farm.query.vgirpc.vendor and upload-URL protocol v2 (branch
  # protocol-3.4 until the release wave), drop this pin and the checkout step,
  # and restore VGI_RPC_JAVA_DIR: /nonexistent (validate the Maven dependency).
  VGI_RPC_JAVA_REF: 83179a652ab4c5d82674380a6cb4ea5d270f4e81
  VGI_RPC_JAVA_DIR: ${{ github.workspace }}/vgi-rpc-java

jobs:
  build-worker:
    name: Build worker once
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vgi-java
        uses: actions/checkout@v4

      - name: Checkout vgi-rpc-java at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-java
          ref: ${{ env.VGI_RPC_JAVA_REF }}
          path: vgi-rpc-java

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build example worker
        run: ./gradlew --no-daemon :vgi-example-worker:installDist

      # Archive before upload because upload-artifact does not preserve the
      # executable bit on the generated launcher script.
      - name: Package worker
        run: tar -czf vgi-java-worker.tar.gz vgi-example-worker/build/install/vgi-example-worker

      - name: Upload worker
        uses: actions/upload-artifact@v4
        with:
          name: vgi-java-worker-${{ github.sha }}
          path: vgi-java-worker.tar.gz
          if-no-files-found: error
          retention-days: 1

  integration:
    needs: build-worker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # launch: the AF_UNIX worker pool. shm: same, plus the POSIX
          # shared-memory side channel (VGI_RPC_SHM_SIZE_BYTES). http: the whole
          # suite over the stateless HTTP transport (state-token continuations),
          # mirroring vgi's `make test_http`.
          - { lane: launch }
          - { lane: shm, shm_bytes: '67108864' }
          - { lane: http, transport: http }
          # vendor: the http lane with vgi-rpc's fake blob vendor (results over
          # 4 KiB externalized, requests over 32 KiB uploaded through vendor
          # URLs, storage values over 4 KiB kept in the vendor), then
          # test/sql/external_storage/* (vgi docs/testing/blob-test-catalog.md).
          - { lane: vendor, transport: http, blob_vendor: '1' }
    name: integration (${{ matrix.lane }})
    steps:
      - name: Checkout vgi-java
        uses: actions/checkout@v4

      - name: Checkout current vgi test suite
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi-upstream

      # start_fake_blob_vendor.sh runs vgi-rpc-fake-vendor with uvx.
      - name: Set up uv (blob-vendor lane)
        if: matrix.blob_vendor == '1'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download worker
        uses: actions/download-artifact@v4
        with:
          name: vgi-java-worker-${{ github.sha }}

      - name: Extract worker
        run: tar -xzf vgi-java-worker.tar.gz

      - name: Fetch matching native integration runner
        run: >-
          python3 "$VGI_SRC/scripts/ci_fetch_native_runner.py"
          --source "$VGI_SRC" --output "$RUNNER_TEMP/vgi-native"
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          GH_TOKEN: ${{ github.token }}

      - name: Run integration suite (${{ matrix.lane }})
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          VGI_WORKER_BIN: ${{ github.workspace }}/vgi-example-worker/build/install/vgi-example-worker/bin/vgi-example-worker
          # Empty for the launch lane; run-integration.sh drops an empty value.
          VGI_RPC_SHM_SIZE_BYTES: ${{ matrix.shm_bytes || '' }}
          # launch (default) unless the lane selects the http transport.
          TRANSPORT: ${{ matrix.transport || 'launch' }}
          # 1 on the vendor lane: start the fake blob vendor, run external_storage/.
          BLOB_VENDOR: ${{ matrix.blob_vendor || '0' }}
          # JDK 25 + native access for the worker JVM (FFM shm, haybarn_jdbc).
          JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED
